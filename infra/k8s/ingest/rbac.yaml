# Airflow 스케줄러(LocalExecutor 라 태스크도 여기서 돈다)가 rebom-ingest 에 수집 파드를 만들고, 로그를 읽고, 지운다.
# 다른 네임스페이스와 Secret 내용에는 권한을 주지 않는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pod-launcher
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-pod-launcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-pod-launcher
subjects:
  # 차트가 만드는 스케줄러 서비스 계정 (릴리스 이름 airflow)
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: airflow
---
# 수집 파드용 서비스 계정. 클러스터 API 를 쓰지 않으므로 토큰을 붙이지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rebom-ingest
automountServiceAccountToken: false
