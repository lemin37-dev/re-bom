# 수집 파드가 뜨는 네임스페이스와, Airflow 가 거기에 파드를 띄울 권한.
# Argo CD Application airflow(infra/k8s/argocd/apps/airflow.yaml)가 같이 관리한다. 직접 apply 하지 않는다.
# API 키 Secret(rebom-ingest)은 여기 두지 않는다. 사람이 만든다 (infra/k8s/airflow/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rebom-ingest
labels:
  - pairs:
      app.kubernetes.io/part-of: rebom
    includeSelectors: false
resources:
  - namespace.yaml
  - rbac.yaml
