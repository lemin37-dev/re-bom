# Argo CD 공식 Helm 차트 (argo/argo-cd) 최소 구성. 개발 k3s(EC2 1대)용.
# 차트 버전은 README 의 helm 명령에서 고정한다: 10.11.1 (Argo CD v3.5.6, 2026-10-23 배포)
# 설치는 사람이 한다 (AGENTS.md 5번). 바꾼 뒤에는 helm upgrade 로 다시 적용.

global:
  # 화면 주소. SSM 으로 서버 80(Traefik)을 내 PC 8080 에 붙이고 http://argocd.localhost:8080 로 연다 (README "화면 접속").
  # *.localhost 는 브라우저가 127.0.0.1 로 보낸다. CloudFront 는 Host 를 origin 주소로 바꿔 보내므로 밖에서는 이 규칙에 닿지 않는다.
  domain: argocd.localhost
  # 모든 구성 요소를 k3s 서버 노드에
  nodeSelector:
    rebom/pool: main

configs:
  cm:
    # 레포를 확인하는 주기. 기본 120s. deploy/dev 에 커밋되면 최대 이 시간 안에 반영된다
    timeout.reconciliation: 120s
    exec.enabled: false
    admin.enabled: true # 초기 admin 계정으로만 로그인 (SSO 없음)
    url: http://argocd.localhost:8080 # 화면 주소 (scripts/infra/dev-tunnel.ps1)
  params:
    # Traefik 이 HTTP 로 넘기므로 Argo CD 서버는 TLS 없이 받는다(켜 두면 HTTPS 리다이렉트가 돌고 돈다).
    # 내 PC ~ 서버 구간은 SSM 터널이 암호화한다. 서버 80 은 CloudFront VPC origin 과 노드끼리만 들어온다.
    server.insecure: true
  # 레포가 public 이라 repositories 자격 증명은 넣지 않는다

# HA 끔: 모두 replicas 1
controller:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

server:
  replicas: 1
  service:
    type: ClusterIP
  # Traefik 호스트 규칙: argocd.localhost -> argocd-server (경로 규칙만 있는 web Ingress 보다 먼저 맞는다)
  ingress:
    enabled: true
    ingressClassName: traefik
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

repoServer:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 512Mi }

redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# SSO(dex), 알림, ApplicationSet 은 쓰지 않는다
dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 0 # 차트에 끄는 스위치가 없어 0 대로 둔다 (CRD 는 남음)
