apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rebom-storage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lemin37-dev/re-bom.git
    targetRevision: develop
    path: infra/k8s/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: rebom-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
