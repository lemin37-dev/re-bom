[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebom"
version = "0.1.0"
description = "Re:봄 유기동물 입양 멀티모달 검색 파이프라인"
requires-python = ">=3.11"
# 수집(src/rebom/ingestion)이 쓰는 기본 의존성
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 수집 결과를 S3 에 올릴 때 (REBOM_S3_BUCKET). 수집 이미지 infra/docker/ingest.Dockerfile
ingest = [
    "boto3>=1.34",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",  # REBOM_DATA_MODE=db (RDS 서비스 표 읽기)
    "boto3>=1.34",  # db 접속 정보(Secrets Manager)
    "Pillow>=10",  # 사진으로 찾기 질의 전처리 (serving/query_embed.py)
]
photos = [
    "Pillow>=10",
]
storage = [
    "pyiceberg[glue,pyarrow]==0.12.0",
    "pyarrow==26.0.1",
    "boto3==1.43.71",
]
# 사진 임베딩 (src/rebom/embedding): Gemini Embedding 2 + pgvector(RDS)
embed = [
    "google-genai>=1.30",
    "boto3>=1.34",
    "psycopg[binary]>=3.2",
    "Pillow>=10",
    "pyarrow>=15",
    "pyiceberg[glue,pyarrow]==0.12.0",  # Gold 임베딩 묶음 표 읽기·쓰기 (--gold-env, gold_store.py)
]
# 사진 태깅(src/rebom/tagging, OpenRouter 호출·Silver 읽기·Gold 쓰기). 이미지 infra/docker/tag-img.Dockerfile
tag = [
    "Pillow>=10",
    "pyiceberg[glue,pyarrow]==0.12.0",
    "pyarrow==26.0.1",
    "boto3==1.43.71",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "Pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 품종 후보 62종 목록 (src/rebom/tagging/breed_tags.py 가 읽는다)
"rebom.tagging" = ["data/*.json"]
# 글 카드 템플릿 (src/rebom/embedding/card_template.py 가 읽는다)
"rebom.embedding" = ["card_templates/*.json"]
# 운영 화면이 비교할 문서상 스키마 (scripts/schema/build_schema_catalog.py 가 만든다, serving/ops_api.py 가 읽는다)
"rebom.serving" = ["ops_schema_catalog.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
