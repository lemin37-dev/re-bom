# develop 에 머지되면 검색 API·웹 화면 이미지를 빌드해 ECR 에 올린다.
# 필요: 저장소 Variable AWS_ECR_PUSH_ROLE_ARN (infra/terraform/registry 출력 github_push_role_arn).
#   비밀값이 아니라 Secret 이 아니어도 된다. AWS 키는 쓰지 않는다(OIDC).
# 역할은 develop 브랜치 워크플로만 맡을 수 있다. 수동 실행도 develop 을 골라야 한다.
# 태그: develop(덮어씀) + sha-<커밋 7자리>
name: 이미지 빌드 (ECR)

on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "data/sample/**"
      - "infra/docker/api*"
      - ".dockerignore"
      - "frontend/**"
      - "infra/docker/web*"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "빌드할 이미지"
        type: choice
        options: [all, api, web]
        default: all

permissions:
  contents: read
  id-token: write # OIDC 로 AWS 역할 맡기

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.pick.outputs.api }}
      web: ${{ steps.pick.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - "src/**"
              - "pyproject.toml"
              - "data/sample/**"
              - "infra/docker/api*"
              - ".dockerignore"
              - ".github/workflows/build-images.yml"
            web:
              - "frontend/**"
              - "infra/docker/web*"
              - ".github/workflows/build-images.yml"
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          API_CHANGED: ${{ steps.filter.outputs.api }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$TARGET" = all ] || [ "$TARGET" = api ] && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
            [ "$TARGET" = all ] || [ "$TARGET" = web ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
          else
            echo "api=$API_CHANGED" >> "$GITHUB_OUTPUT"
            echo "web=$WEB_CHANGED" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            repo: rebom/api
            dockerfile: infra/docker/api.Dockerfile
            context: .
          - name: web
            repo: rebom/web
            dockerfile: infra/docker/web.Dockerfile
            context: frontend
    steps:
      - name: 바뀐 것만 빌드
        id: skip
        env:
          API: ${{ needs.changes.outputs.api }}
          WEB: ${{ needs.changes.outputs.web }}
          NAME: ${{ matrix.name }}
        run: |
          if [ "$NAME" = api ]; then want="$API"; else want="$WEB"; fi
          echo "run=$want" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.skip.outputs.run == 'true'

      - name: AWS 역할 맡기 (OIDC)
        if: steps.skip.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        if: steps.skip.outputs.run == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3
        if: steps.skip.outputs.run == 'true'

      - name: 태그 정하기
        if: steps.skip.outputs.run == 'true'
        id: tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ matrix.repo }}
          SHA: ${{ github.sha }}
        run: |
          image="$REGISTRY/$REPO"
          {
            echo "tags<<EOF"
            echo "$image:develop"
            echo "$image:sha-${SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 빌드·올리기
        if: steps.skip.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false # ECR 에 태그 없는 부가 이미지가 쌓이지 않게
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
