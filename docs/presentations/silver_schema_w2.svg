<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F7FAF8"/><text x="64" y="72" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#2D6B54">RE:봄  ·  W2 DATA CONTRACT</text><text x="64" y="132" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="42" font-weight="700" fill="#173B31">Silver 칼럼 제안</text><text x="64" y="174" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="21" fill="#607168">공고 원문 · 정제값 · 모델 생성값의 역할과 화면 노출 범위를 정리한 검토용 스키마</text><rect x="1505" y="78" width="350" height="54" rx="27" fill="#F8F1D9"/><text x="1680" y="112" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="19" font-weight="700" fill="#173B31">제안 · 최종 데이터 계약 전</text><rect x="64" y="210" width="576" height="336" rx="22" fill="#E4F0E8" stroke="#D8E4DC" stroke-width="2"/><circle cx="95" cy="248" r="9" fill="#2D6B54"/><text x="118" y="257" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="25" font-weight="700" fill="#173B31">01  공고 · 품종 연결</text><circle cx="94" cy="291" r="4.5" fill="#7EB69A"/><text x="112" y="298" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">is_mix · kindNm에 “믹스” 포함 또는 기타 코드</text><text x="112" y="320" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">000115</text><circle cx="94" cy="338" r="4.5" fill="#7EB69A"/><text x="112" y="345" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">믹스 참이면 믹스 묶음으로 분류 · 품종 정보와 연결하지</text><text x="112" y="367" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">않음</text><circle cx="94" cy="385" r="4.5" fill="#7EB69A"/><text x="112" y="392" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">kindNm · API 품종명을 그대로 표시</text><circle cx="94" cy="410" r="4.5" fill="#7EB69A"/><text x="112" y="417" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">breed_key · 품종견만 품종 정보 표와 연결 [내부·제안];</text><text x="112" y="439" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">믹스·기타는 null</text><rect x="672" y="210" width="576" height="336" rx="22" fill="#FFFFFF" stroke="#D8E4DC" stroke-width="2"/><circle cx="703" cy="248" r="9" fill="#2D6B54"/><text x="726" y="257" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="25" font-weight="700" fill="#173B31">02  나이 · 체중 · 크기</text><circle cx="702" cy="291" r="4.5" fill="#7EB69A"/><text x="720" y="298" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">age · 원문: YYYY(년생) / YYYY(60일미만)(년생)</text><circle cx="702" cy="316" r="4.5" fill="#7EB69A"/><text x="720" y="323" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">birth_year · 4자리 출생연도 → 화면에서 “NN년생</text><text x="720" y="345" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">(N살)” 계산</text><circle cx="702" cy="363" r="4.5" fill="#7EB69A"/><text x="720" y="370" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">u60_at_notice · 60일 미만 표기 여부 [내부]</text><circle cx="702" cy="388" r="4.5" fill="#7EB69A"/><text x="720" y="395" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">weight · 원문 보존 · weight_kg은 g→kg 변환, 100kg</text><text x="720" y="417" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">초과 null [표시·안내]</text><circle cx="702" cy="435" r="4.5" fill="#7EB69A"/><text x="720" y="442" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">size · 개만: ≤10kg 소형 / 10–&lt;25kg 중형 / ≥25kg</text><text x="720" y="464" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">대형; 필터</text><rect x="1280" y="210" width="576" height="336" rx="22" fill="#F8F1D9" stroke="#D8E4DC" stroke-width="2"/><circle cx="1311" cy="248" r="9" fill="#2D6B54"/><text x="1334" y="257" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="25" font-weight="700" fill="#173B31">03  털색 · 성별 · 상태 · 지역</text><circle cx="1310" cy="291" r="4.5" fill="#7EB69A"/><text x="1328" y="298" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">colorCd · 자유 기재 원문 표시</text><circle cx="1310" cy="316" r="4.5" fill="#7EB69A"/><text x="1328" y="323" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">color_tag · 흰색·검정·갈색·회색·노랑 계열(복수);</text><text x="1328" y="345" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">미분류는 기타 [필터]</text><circle cx="1310" cy="363" r="4.5" fill="#7EB69A"/><text x="1328" y="370" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">color_pattern · 호피·얼룩·삼색·반점·턱시도·줄무늬</text><text x="1328" y="392" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">[표시]</text><circle cx="1310" cy="410" r="4.5" fill="#7EB69A"/><text x="1328" y="417" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">sexCd / neuterYn · M/F/Q · Y/N/U [표시·필터]</text><circle cx="1310" cy="435" r="4.5" fill="#7EB69A"/><text x="1328" y="442" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">processState / endReason · 상태·처분사유 [보호중</text><text x="1328" y="464" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">필터]</text><circle cx="1310" cy="482" r="4.5" fill="#7EB69A"/><text x="1328" y="489" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">happenPlace / orgNm · 발견장소·관할 지역 [표시·지역</text><text x="1328" y="511" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">필터]</text><rect x="64" y="570" width="576" height="336" rx="22" fill="#FFFFFF" stroke="#D8E4DC" stroke-width="2"/><circle cx="95" cy="608" r="9" fill="#2D6B54"/><text x="118" y="617" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="25" font-weight="700" fill="#173B31">04  보호소 · 원문 정보</text><circle cx="94" cy="651" r="4.5" fill="#7EB69A"/><text x="112" y="658" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">careRegNo / careNm / careTel / careAddr · 보호소</text><text x="112" y="680" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">정보 표시</text><circle cx="94" cy="698" r="4.5" fill="#7EB69A"/><text x="112" y="705" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">specialMark / sfeSoci / sfeHealth / healthChk /</text><text x="112" y="727" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">vaccinationChk · 원문 표시</text><circle cx="94" cy="745" r="4.5" fill="#7EB69A"/><text x="112" y="752" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">건강 정보는 원문 유지 · 모델이 정제한 값과 구분</text><circle cx="94" cy="770" r="4.5" fill="#7EB69A"/><text x="112" y="777" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">info_text · 사회성 + 건강 + 특징을 코드로 연결해</text><text x="112" y="799" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">Jev에 전달 [내부]</text><rect x="672" y="570" width="576" height="336" rx="22" fill="#F8E9DF" stroke="#D8E4DC" stroke-width="2"/><circle cx="703" cy="608" r="9" fill="#2D6B54"/><text x="726" y="617" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="25" font-weight="700" fill="#173B31">05  Jev 태그 · 등록 확인</text><circle cx="702" cy="651" r="4.5" fill="#7EB69A"/><text x="720" y="658" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">social_text · Jev 성격 결과 → 상위 태그로 표시;</text><text x="720" y="680" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">원문은 내부 보존</text><circle cx="702" cy="698" r="4.5" fill="#7EB69A"/><text x="720" y="705" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">health_text · Jev 건강 결과 → 부위별 태그로 표시;</text><text x="720" y="727" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">원문은 내부 보존</text><circle cx="702" cy="745" r="4.5" fill="#7EB69A"/><text x="720" y="752" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">rfid_yn · 등록 확인 여부를 “동물등록 확인됨”으로</text><text x="720" y="774" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">표시</text><circle cx="702" cy="792" r="4.5" fill="#7EB69A"/><text x="720" y="799" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">rfidCd · 실제 등록번호는 내부 전용</text><rect x="1280" y="570" width="576" height="336" rx="22" fill="#D9EDE1" stroke="#D8E4DC" stroke-width="2"/><circle cx="1311" cy="608" r="9" fill="#2D6B54"/><text x="1334" y="617" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="25" font-weight="700" fill="#173B31">06  모델 · 태그 버전</text><circle cx="1310" cy="651" r="4.5" fill="#7EB69A"/><text x="1328" y="658" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">embedding · 모델명 · 버전 · 생성 시점 등 [JSON</text><text x="1328" y="680" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">메타데이터]</text><circle cx="1310" cy="698" r="4.5" fill="#7EB69A"/><text x="1328" y="705" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">jev · API/모델 정보 · 처리 시점 등 [JSON 메타데이터]</text><circle cx="1310" cy="723" r="4.5" fill="#7EB69A"/><text x="1328" y="730" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">tag_version · 태그 기준표·채점 버전</text><circle cx="1310" cy="748" r="4.5" fill="#7EB69A"/><text x="1328" y="755" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#173B31">원천·모델·태그 버전을 분리 기록해 재현·재처리 기준으로</text><text x="1328" y="777" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" fill="#607168">활용</text><rect x="64" y="936" width="1792" height="90" rx="20" fill="#173B31"/><text x="92" y="972" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">노출 구분</text><rect x="230" y="950" width="174" height="38" rx="19" fill="#E4F0E8"/><text x="317" y="976" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700" fill="#173B31">표시</text><rect x="440" y="950" width="174" height="38" rx="19" fill="#F8F1D9"/><text x="527" y="976" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700" fill="#173B31">필터</text><rect x="650" y="950" width="174" height="38" rx="19" fill="#F8E9DF"/><text x="737" y="976" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700" fill="#173B31">내부 전용</text><rect x="860" y="950" width="174" height="38" rx="19" fill="#D9EDE1"/><text x="947" y="976" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700" fill="#173B31">JSON 메타데이터</text><text x="1080" y="973" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" fill="#FFFFFF">원문은 보존하고, 정제·모델 파생값은 용도를 구분해 저장합니다.</text><text x="1080" y="1003" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16" fill="#D9EDE1">주의: breed_key 및 테이블 분리는 제안이며 팀 데이터 계약 확정 전입니다.</text></svg>